name: timesheet_mobile
description: My Self Management Nicknameinfo Infotech
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Networking
  http: ^1.1.0
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Local Storage & Offline
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Push Notifications
  # firebase_core: ^2.24.2  # Uncomment when Firebase is configured
  # firebase_messaging: ^14.7.9  # Uncomment when Firebase is configured
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.2
  flutter_native_timezone: ^2.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  image_picker: ^1.0.7

  # Date & Time
  intl: ^0.18.1
  table_calendar: ^3.0.9

  # Charts
  fl_chart: ^0.66.0

  # Location (for future GPS feature)
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Payments (mobile: Android/iOS; web: razorpay_web)
  razorpay_flutter: ^1.3.6
  # razorpay_web: ^3.1.0

  # Utilities
  permission_handler: ^11.3.0
  url_launcher: ^6.2.2
  uuid: ^4.2.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  logger: ^2.0.2+1
  
  # Background Tasks
  # Note: workmanager removed due to compatibility issues with Flutter embedding
  # Background timer functionality will work when app is in foreground
  # flutter_background_service: ^5.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  
  # Icon Generator Package
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# Configuration for App Icon
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false  # Set to false if iOS platform is not configured
  image_path: "assets/icons/app_icon.png" # Make sure your image is here
  min_sdk_android: 21